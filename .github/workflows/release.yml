# Uma release por versão de cada plugin, quando o número muda na main (ou à mão em Actions):
# - Claude: v<versão> com o cotrip.plugin (é a "mais recente", usada no link de download do README).
# - OpenAI: openai-v<versão> com o cotrip-openai.zip para subir no portal (não vira a "mais recente").
name: Release
on:
  push:
    branches: [main]
    paths: ["claude/.claude-plugin/plugin.json", "openai/plugin.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: claude
            manifest: claude/.claude-plugin/plugin.json
            prefix: v
            file: dist/cotrip.plugin
            latest: "true"
          - name: openai
            manifest: openai/plugin.json
            prefix: openai-v
            file: dist/cotrip-openai.zip
            latest: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versão
        id: version
        run: echo "tag=${{ matrix.prefix }}$(node -p "require('./${{ matrix.manifest }}').version")" >> "$GITHUB_OUTPUT"
      - run: node scripts/pack-plugin.mjs ${{ matrix.name }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG já existe; suba a versão no manifesto para publicar outra."
          else
            gh release create "$TAG" "${{ matrix.file }}" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest=${{ matrix.latest }}
          fi
