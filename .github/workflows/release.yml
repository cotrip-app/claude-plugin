# One release per version of each plugin, when the number changes on main (or by hand in Actions):
# - Claude: v<version> with cotrip.plugin (marked "latest", used by the README download link).
# - OpenAI: openai-v<version> with cotrip-openai.zip to upload to the portal (not marked "latest").
name: Release
on:
  push:
    branches: [main]
    paths: ["claude/.claude-plugin/plugin.json", "openai/plugin.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: claude
            manifest: claude/.claude-plugin/plugin.json
            prefix: v
            file: dist/cotrip.plugin
            latest: "true"
          - name: openai
            manifest: openai/plugin.json
            prefix: openai-v
            file: dist/cotrip-openai.zip
            latest: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: echo "tag=${{ matrix.prefix }}$(node -p "require('./${{ matrix.manifest }}').version")" >> "$GITHUB_OUTPUT"
      - run: node scripts/pack-plugin.mjs ${{ matrix.name }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; bump the version in the manifest to publish another."
          else
            gh release create "$TAG" "${{ matrix.file }}" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest=${{ matrix.latest }}
          fi
